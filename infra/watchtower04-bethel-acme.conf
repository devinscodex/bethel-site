# watchtower04: temporary port-80 vhost, used only to obtain the certificate
server {
    listen 80;
    listen [::]:80;
    server_name bethel.ravenscrest.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
