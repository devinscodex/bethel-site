# watchtower04: /etc/nginx/sites-available/bethel.conf (symlink into sites-enabled)
# Public relay: / -> quill (static site), /media/ -> zekrom (audio, cached).
# Both origins are tailnet-only addresses.

proxy_cache_path /var/cache/nginx/bethel keys_zone=bethel:20m max_size=6g inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=bethel_page:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bethel_media:10m rate=4r/s;

# Allow our own pages and empty referers (direct, privacy browsers); refuse hotlinking.
map $http_referer $bethel_ref_ok {
    default 0;
    ""      1;
    "~^https://bethel\.ravenscrest\.xyz/" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name bethel.ravenscrest.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bethel.ravenscrest.xyz;
    ssl_certificate /etc/letsencrypt/live/bethel.ravenscrest.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bethel.ravenscrest.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        include /etc/nginx/snippets/bethel-headers.conf;
        limit_req zone=bethel_page burst=60 nodelay;
        proxy_pass http://100.72.207.83:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache bethel;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location /media/ {
        include /etc/nginx/snippets/bethel-headers.conf;
        if ($bethel_ref_ok = 0) { return 403; }
        limit_req zone=bethel_media burst=20 nodelay;
        proxy_pass http://100.92.128.16:8097/;
        proxy_set_header Host $host;
        slice 4m;
        proxy_set_header Range $slice_range;
        proxy_cache bethel;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_http_version 1.1;
    }
}
