# watchtower04: /etc/nginx/sites-available/bethel.conf (symlink into sites-enabled)
# Public relay: / -> quill (static site), /media/ -> zekrom (audio, cached).
# Both origins are tailnet-only addresses.

proxy_cache_path /var/cache/nginx/bethel keys_zone=bethel:20m max_size=6g inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=bethel_page:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bethel_media:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=bethel_admin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bethel_comments:10m rate=120r/m;
# Only POSTs get a key, so reading comments is not counted against the post limit.
map $request_method $bethel_post_key { default ""; POST $binary_remote_addr; }
limit_req_zone $bethel_post_key zone=bethel_post:10m rate=6r/m;

# AI training crawlers (also listed in robots.txt) get 403.
map $http_user_agent $bethel_ai_bot {
    default 0;
    ~*(GPTBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Bytespider|meta-externalagent|cohere-ai|Diffbot|ImagesiftBot|Omgilibot) 1;
}

# Allow our own pages and empty referers (direct, privacy browsers); refuse hotlinking.
map $http_referer $bethel_ref_ok {
    default 0;
    ""      1;
    "~^https://bethel\.ravenscrest\.xyz/" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name bethel.ravenscrest.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bethel.ravenscrest.xyz;
    if ($bethel_ai_bot) { return 403; }
    access_log /var/log/nginx/bethel.access.log;
    ssl_certificate /etc/letsencrypt/live/bethel.ravenscrest.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bethel.ravenscrest.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1k;

    # Admin area: password, per-IP rate limit, tailnet-only backends behind it.
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=bethel_admin burst=5 nodelay;
        limit_req_status 429;
        auth_basic "Bethel admin";
        auth_basic_user_file /etc/nginx/bethel-admin.htpasswd;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_set_header Authorization "";
        proxy_pass http://100.105.185.113:8089/;
    }

    # Public comments (Isso on quill). Reads are cheap; posts are limited per IP.
    location /comments/ {
        # Visitors cannot edit or delete notes (PUT/DELETE); moderators use POST in the admin area.
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
        client_max_body_size 8k;
        limit_req zone=bethel_comments burst=40 nodelay;
        limit_req zone=bethel_post burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/bethel-headers.conf;
        proxy_pass http://100.72.207.83:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Comment moderation: our password first, then Isso's own login.
    location ~ ^/comments/(admin|login|logout)(/|$) {
        client_max_body_size 8k;
        limit_req zone=bethel_admin burst=5 nodelay;
        limit_req_status 429;
        auth_basic "Bethel admin";
        auth_basic_user_file /etc/nginx/bethel-admin.htpasswd;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^https?://[^/]+/admin/?$ /comments/admin/;
        proxy_pass http://100.72.207.83:8088;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /etc/nginx/snippets/bethel-headers.conf;
        limit_req zone=bethel_page burst=60 nodelay;
        proxy_pass http://100.72.207.83:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache bethel;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location /media/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /etc/nginx/snippets/bethel-headers.conf;
        if ($bethel_ref_ok = 0) { return 403; }
        limit_req zone=bethel_media burst=20 nodelay;
        proxy_pass http://100.92.128.16:8097/;
        proxy_set_header Host $host;
        slice 4m;
        proxy_set_header Range $slice_range;
        proxy_cache bethel;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_http_version 1.1;
    }
}
