# quill: /etc/nginx/sites-available/bethel (symlink into sites-enabled)
# Static origin for the site, reachable only on the tailnet address.
server {
    listen 100.72.207.83:8088;
    server_name _;
    root /var/www/bethel;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js|webp|jpg|png|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /pagefind/ {
        expires 1h;
    }
    error_page 404 /404.html;
}
