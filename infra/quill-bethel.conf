# quill: /etc/nginx/sites-available/bethel (symlink into sites-enabled)
# Static origin for the site, reachable only on the tailnet address.
server {
    listen 100.72.207.83:8088;
    server_name _;
    root /var/www/bethel;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    # Comments backend (Isso, host network, loopback only). ^~ beats the static-file rule below.
    location ^~ /comments/ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~* \.(css|js|webp|jpg|png|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /pagefind/ {
        expires 1h;
    }
    error_page 404 /404.html;
}
