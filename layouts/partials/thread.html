<aside class="thread" id="thread" data-pagefind-ignore>
<h2>{{ .heading }}</h2>
<p class="meta">{{ .blurb }}</p>
<section id="isso-thread" data-title="{{ .heading }}"></section>
<script async src="/comments/js/embed.min.js" data-isso="/comments/" data-isso-id="{{ .id }}" data-isso-require-author="true" data-isso-vote="false" data-isso-reply-to-self="false" data-isso-max-comments-top="30" data-isso-avatar="false"></script>
</aside>
