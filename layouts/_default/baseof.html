<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
{{ with .Params.summary }}<meta name="description" content="{{ . }}">{{ end }}
<script>(function(){var m=document.cookie.match(/(?:^|; )bt=(light|dark)/);document.documentElement.dataset.theme=m?m[1]:"light"})()</script>
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
{{ partial "header.html" . }}
<main><div class="wrap">{{ block "main" . }}{{ end }}</div></main>
{{ partial "footer.html" . }}
<script>document.getElementById("tg").onclick=function(){var r=document.documentElement,s=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=s;document.cookie="bt="+s+"; max-age=31536000; path=/; SameSite=Lax"}</script>
</body>
</html>
